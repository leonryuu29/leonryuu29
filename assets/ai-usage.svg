<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-label="AI token usage dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="g0" x1="0" x2="1"><stop offset="0" stop-color="#d97757"/><stop offset="1" stop-color="#f4b393"/></linearGradient>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#4d6bfe"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t  { font: 700 20px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #e6edf3; }
      .s  { font: 400 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #8b949e; }
      .h  { font: 600 15px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #e6edf3; }
      .big{ font: 800 34px 'Segoe UI', 'PingFang SC', sans-serif; }
      .k  { font: 400 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #8b949e; }
      .v  { font: 700 13px 'Segoe UI', 'PingFang SC', sans-serif; fill: #e6edf3; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .grow { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    </style>
  </defs>

  <rect width="820" height="520" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="818" height="518" rx="17" fill="none" stroke="#30363d"/>

  <circle cx="34" cy="38" r="6" fill="#2ea043" filter="url(#glow)" class="pulse"/>
  <text x="50" y="45" class="t">AI Token Dashboard</text>
  <text x="250" y="45" class="s">· 实测数据，不是估算 · snapshot 2026-11-22</text>

  <!-- Claude -->
  <rect x="24" y="68" width="380" height="210" rx="14" fill="#0d1117" stroke="#44291f"/>
  <text x="44" y="98" class="h">✳️ Claude · Opus</text>
  <text x="384" y="98" class="s" text-anchor="end">remote dev &amp; ops</text>
  <text x="44" y="142" class="big" fill="url(#g0)">100M+</text>
  <text x="44" y="162" class="s">tokens · one Cloud Server build session · 256 requests</text>
  <rect x="44" y="176" width="340" height="8" rx="4" fill="#21262d"/>
  <rect x="44" y="176" width="337" height="8" rx="4" fill="url(#g0)" class="grow"/>
  <text x="44" y="206" class="k">cache read</text><text x="384" y="206" class="v" text-anchor="end">99.9M · 99%</text>
  <text x="44" y="230" class="k">output</text><text x="384" y="230" class="v" text-anchor="end">241K</text>
  <text x="44" y="254" class="k">where it went</text><text x="384" y="254" class="v" text-anchor="end">context 68% · PC &amp; server 25%</text>

  <!-- Codex -->
  <rect x="416" y="68" width="380" height="210" rx="14" fill="#0d1117" stroke="#1f2a44"/>
  <text x="436" y="98" class="h">⚙️ Codex · DeepSeek Flash</text>
  <text x="776" y="98" class="s" text-anchor="end">daily coding</text>
  <text x="436" y="142" class="big" fill="url(#g1)">2.33B</text>
  <text x="436" y="162" class="s">tokens · 92 sessions since 11/01</text>
  <rect x="436" y="176" width="340" height="8" rx="4" fill="#21262d"/>
  <rect x="436" y="176" width="333" height="8" rx="4" fill="url(#g1)" class="grow"/>
  <text x="436" y="206" class="k">cache hit</text><text x="776" y="206" class="v" text-anchor="end">98%</text>
  <text x="436" y="230" class="k">output</text><text x="776" y="230" class="v" text-anchor="end">3.31M</text>
  <text x="436" y="254" class="k">reasoning</text><text x="776" y="254" class="v" text-anchor="end">1.38M</text>

  <!-- 大肥鱼 -->
  <rect x="24" y="290" width="380" height="210" rx="14" fill="#0d1117" stroke="#2d1f44"/>
  <text x="44" y="320" class="h">🐋 大肥鱼 · QQ bot</text>
  <text x="384" y="320" class="s" text-anchor="end">DeepSeek · on my server</text>
  <text x="44" y="364" class="big" fill="url(#g2)">624K</text>
  <text x="44" y="384" class="s">input tokens · live since 11/21</text>
  <rect x="44" y="398" width="340" height="8" rx="4" fill="#21262d"/>
  <rect x="44" y="398" width="296" height="8" rx="4" fill="url(#g2)" class="grow"/>
  <text x="44" y="428" class="k">cache hit</text><text x="384" y="428" class="v" text-anchor="end">87%</text>
  <text x="44" y="452" class="k">output · avg reply</text><text x="384" y="452" class="v" text-anchor="end">6.2K · 2.4 s</text>
  <text x="44" y="476" class="k">daily pushes</text><text x="384" y="476" class="v" text-anchor="end">11 + important mail</text>

  <!-- zero token -->
  <rect x="416" y="290" width="380" height="210" rx="14" fill="#0d1117" stroke="#44321f"/>
  <text x="436" y="320" class="h">🐕 Zero-token automation</text>
  <text x="776" y="320" class="s" text-anchor="end">code first</text>
  <text x="436" y="364" class="big" fill="url(#g3)">0</text>
  <text x="462" y="364" class="s">tokens per check</text>
  <circle cx="442" cy="400" r="4" fill="#f59e0b" class="pulse"/><text x="454" y="404" class="k">watchdog · every 10 min · 0.44 s · 33 MB</text>
  <circle cx="442" cy="424" r="4" fill="#f59e0b" class="pulse"/><text x="454" y="428" class="k">mail doorbell · wakes the bot only for real mail</text>
  <circle cx="442" cy="448" r="4" fill="#f59e0b" class="pulse"/><text x="454" y="452" class="k">context capped at 30 turns (was 20K/call)</text>
  <circle cx="442" cy="472" r="4" fill="#f59e0b" class="pulse"/><text x="454" y="476" class="k">PC agents load 7 tools · ≈1K tokens</text>
</svg>
