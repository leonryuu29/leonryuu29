<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="AI token usage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#4d6bfe"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t  { font: 700 20px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #e6edf3; }
      .s  { font: 400 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #8b949e; }
      .h  { font: 600 14px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #e6edf3; }
      .big{ font: 800 30px 'Segoe UI', 'PingFang SC', sans-serif; }
      .k  { font: 400 11px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #8b949e; }
      .v  { font: 700 13px 'Segoe UI', 'PingFang SC', sans-serif; fill: #e6edf3; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .grow { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    </style>
  </defs>

  <rect width="820" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="818" height="298" rx="17" fill="none" stroke="#30363d"/>

  <!-- header -->
  <circle cx="34" cy="38" r="6" fill="#2ea043" filter="url(#glow)" class="pulse"/>
  <text x="50" y="45" class="t">AI Token Dashboard</text>
  <text x="250" y="45" class="s">· 实测数据，不是估算 · snapshot 2026-11-22</text>

  <!-- card 1: Codex -->
  <rect x="24" y="68" width="250" height="208" rx="14" fill="#0d1117" stroke="#1f2a44"/>
  <text x="42" y="96" class="h">⚙️ Codex · DeepSeek Flash</text>
  <text x="42" y="136" class="big" fill="url(#g1)">2.33B</text>
  <text x="42" y="154" class="s">tokens · 92 sessions since 11/01</text>
  <rect x="42" y="170" width="214" height="8" rx="4" fill="#21262d"/>
  <rect x="42" y="170" width="210" height="8" rx="4" fill="url(#g1)" class="grow"/>
  <text x="42" y="194" class="k">cache hit</text><text x="256" y="194" class="v" text-anchor="end">98%</text>
  <text x="42" y="216" class="k">output</text><text x="256" y="216" class="v" text-anchor="end">3.31M</text>
  <text x="42" y="238" class="k">reasoning</text><text x="256" y="238" class="v" text-anchor="end">1.38M</text>
  <text x="42" y="260" class="k">role</text><text x="256" y="260" class="v" text-anchor="end">daily coding</text>

  <!-- card 2: 大肥鱼 -->
  <rect x="285" y="68" width="250" height="208" rx="14" fill="#0d1117" stroke="#2d1f44"/>
  <text x="303" y="96" class="h">🐋 大肥鱼 · QQ bot</text>
  <text x="303" y="136" class="big" fill="url(#g2)">624K</text>
  <text x="303" y="154" class="s">input tokens · live since 11/21</text>
  <rect x="303" y="170" width="214" height="8" rx="4" fill="#21262d"/>
  <rect x="303" y="170" width="186" height="8" rx="4" fill="url(#g2)" class="grow"/>
  <text x="303" y="194" class="k">cache hit</text><text x="517" y="194" class="v" text-anchor="end">87%</text>
  <text x="303" y="216" class="k">output</text><text x="517" y="216" class="v" text-anchor="end">6.2K</text>
  <text x="303" y="238" class="k">daily pushes</text><text x="517" y="238" class="v" text-anchor="end">11 + mail</text>
  <text x="303" y="260" class="k">avg reply</text><text x="517" y="260" class="v" text-anchor="end">2.4 s</text>

  <!-- card 3: what costs nothing -->
  <rect x="546" y="68" width="250" height="208" rx="14" fill="#0d1117" stroke="#44321f"/>
  <text x="564" y="96" class="h">🐕 Zero-token automation</text>
  <text x="564" y="136" class="big" fill="url(#g3)">0</text>
  <text x="590" y="136" class="s">tokens / check</text>
  <text x="564" y="154" class="s">code checks first, AI only when needed</text>
  <circle cx="570" cy="190" r="4" fill="#f59e0b" class="pulse"/><text x="582" y="194" class="k">watchdog · every 10 min · 0.44 s</text>
  <circle cx="570" cy="212" r="4" fill="#f59e0b" class="pulse"/><text x="582" y="216" class="k">mail doorbell · every 10 min</text>
  <circle cx="570" cy="234" r="4" fill="#f59e0b" class="pulse"/><text x="582" y="238" class="k">context cap 30 turns · 20K → bounded</text>
  <circle cx="570" cy="256" r="4" fill="#f59e0b" class="pulse"/><text x="582" y="260" class="k">PC agents load 7 tools (≈1K tokens)</text>
</svg>
